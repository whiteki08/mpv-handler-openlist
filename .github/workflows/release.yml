# .github/workflows/release.yml

name: Build and Release

on:
  # Trigger on tag push
  push:
    tags:
      - 'v*'
  # Manual runs require an explicit release tag.
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to create or update for the release, for example v4.4.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test Windows Handler
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

  test-js:
    name: Test Userscript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run JavaScript tests
        run: node --test tests/script.test.mjs

      - name: Check userscript syntax
        run: node --check script.js

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build for windows/${{ matrix.goarch }}
        run: |
          # 1. -s -w: 去除调试信息，减小体积
          # 2. -H windowsgui: 隐藏控制台黑框 (关键修改)
          GOOS=windows GOARCH=${{ matrix.goarch }} go build -o mpv-handler-${{ matrix.goarch }}.exe -ldflags="-s -w -H windowsgui" ./cmd/mpv-handler

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mpv-handler-${{ matrix.goarch }}
          path: mpv-handler-${{ matrix.goarch }}.exe

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, test-js, build]
    # Tag pushes use github.ref_name; manual runs use the required tag_name input.
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.exe
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
